
<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    
    <meta name="theme-color" content="#1e1b4b" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Docházka">
    
    <title>Chytrá docházka</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/9512/9512839.png">
    
    <!-- Polyfill pro starší Safari (iOS < 16.4) - MUSÍ BÝT PRVNÍ -->
    <script async src="https://ga.jspm.io/npm:es-module-shims@1.10.1/dist/es-module-shims.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
      body { font-family: 'Inter', sans-serif; background-color: #0f172a; margin: 0; padding: 0; overscroll-behavior-y: none; color: white; }
      #app-loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0f172a; z-index: 9999; text-align: center; padding: 20px; }
      .loader-logo { width: 80px; height: 80px; background: #4f46e5; border-radius: 20px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; box-shadow: 0 0 30px rgba(79, 70, 229, 0.4); }
      .loader-spinner { width: 30px; height: 30px; border: 3px solid rgba(255,255,255,0.1); border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      #reset-btn { display: none; margin-top: 20px; background: #ef4444; color: white; padding: 14px 28px; border-radius: 12px; font-size: 15px; font-weight: bold; border: none; cursor: pointer; box-shadow: 0 4px 20px rgba(239, 68, 68, 0.4); }
      #error-log { display: none; margin-top: 20px; background: #1e293b; color: #f87171; padding: 15px; border-radius: 10px; font-family: monospace; font-size: 12px; max-width: 100%; word-break: break-all; text-align: left; border: 1px solid #ef4444; box-shadow: 0 0 15px rgba(239, 68, 68, 0.1); }
    </style>

    <!-- Změna na importmap-shim pro es-module-shims -->
    <script type="importmap-shim">
    {
      "imports": {
        "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
        "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
        "uuid": "https://aistudiocdn.com/uuid@^13.0.0",
        "react/": "https://aistudiocdn.com/react@^19.2.0/",
        "react": "https://aistudiocdn.com/react@^19.2.0",
        "recharts": "https://aistudiocdn.com/recharts@^3.4.1",
        "jspdf": "https://aistudiocdn.com/jspdf@^2.5.1",
        "jspdf-autotable": "https://aistudiocdn.com/jspdf-autotable@^3.8.2",
        "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.1",
        "vite": "https://aistudiocdn.com/vite@^7.2.4",
        "@supabase/supabase-js": "https://aistudiocdn.com/@supabase/supabase-js@^2.39.0"
      }
    }
    </script>
  <script type="importmap">
{
  "imports": {
    "vite": "https://esm.sh/vite@^7.3.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "uuid": "https://esm.sh/uuid@^13.0.0",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "jspdf": "https://esm.sh/jspdf@^3.0.4",
    "jspdf-autotable": "https://esm.sh/jspdf-autotable@^5.0.2",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.89.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="app-loader">
      <div class="loader-logo">
        <svg width="40" height="40" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 30 L40 75 L60 30 L80 75 L100 30" stroke="white" strokeWidth="12" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      </div>
      <div class="loader-spinner"></div>
      <p id="loader-status" style="color: #94a3b8; font-size: 14px; margin-top: 20px; font-weight: 500;">Spouštění verze 1.7.6...</p>
      
      <div id="error-log"></div>
      <button id="reset-btn" onclick="emergencyReset()">VYČISTIT A OPRAVIT</button>
      
      <p style="color: #334155; font-size: 10px; margin-top: 30px;">Win3 Studio Docházka © 2024</p>
    </div>

    <div id="root"></div>

    <!-- Změna na module-shim pro es-module-shims -->
    <script type="module-shim" src="./index.tsx"></script>

    <script>
      window.APP_STARTED = false;

      // Diagnostika chyb
      window.onerror = function(msg, url, line, col, error) {
        const log = document.getElementById('error-log');
        const btn = document.getElementById('reset-btn');
        const status = document.getElementById('loader-status');
        
        if (log) {
          log.style.display = 'block';
          log.innerText = "CHYBA: " + msg + "\nLine: " + line + ":" + col;
        }
        if (status) status.innerText = "Chyba při startu systému.";
        if (btn) btn.style.display = 'block';
        
        console.error("Critical error:", msg, url, line);
        return false;
      };

      // Emergency reset
      async function emergencyReset() {
        if (confirm("Vymazat paměť a restartovat aplikaci?")) {
          localStorage.clear();
          sessionStorage.clear();
          if ('caches' in window) {
            const keys = await caches.keys();
            await Promise.all(keys.map(key => caches.delete(key)));
          }
          if ('serviceWorker' in navigator) {
            const regs = await navigator.serviceWorker.getRegistrations();
            for(let r of regs) await r.unregister();
          }
          window.location.href = window.location.origin + window.location.pathname + '?r=' + Date.now();
        }
      }

      // Detekce bílé obrazovky
      setTimeout(() => {
        if (!window.APP_STARTED) {
          document.getElementById('loader-status').innerText = "Systém neodpovídá. Zkuste opravu.";
          document.getElementById('reset-btn').style.display = "block";
          
          // Pokud je to starý prohlížeč, vypíšeme to
          if (!window.HTMLScriptElement.supports || !window.HTMLScriptElement.supports('importmap')) {
             const log = document.getElementById('error-log');
             log.style.display = 'block';
             log.innerText += "\nDiagnostika: Váš iPhone (verze pod 16.4) vyžaduje opravný režim 'Shim'. Pokud toto vidíte, systém se pokouší o opravu...";
          }
        }
      }, 7000);
    </script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
