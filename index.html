
<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <meta name="theme-color" content="#1e1b4b" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Docházka">
    
    <title>Chytrá docházka</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/9512/9512839.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
      body { font-family: 'Inter', sans-serif; background-color: #0f172a; margin: 0; padding: 0; overscroll-behavior-y: none; color: white; }
      #app-loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0f172a; z-index: 9999; }
      .loader-logo { width: 80px; height: 80px; background: #4f46e5; border-radius: 20px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; box-shadow: 0 0 30px rgba(79, 70, 229, 0.4); }
      .loader-spinner { width: 30px; height: 30px; border: 3px solid rgba(255,255,255,0.1); border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>

    <script type="importmap">
    {
      "imports": {
        "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
        "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
        "uuid": "https://aistudiocdn.com/uuid@^13.0.0",
        "react/": "https://aistudiocdn.com/react@^19.2.0/",
        "react": "https://aistudiocdn.com/react@^19.2.0",
        "recharts": "https://aistudiocdn.com/recharts@^3.4.1",
        "jspdf": "https://aistudiocdn.com/jspdf@^2.5.1",
        "jspdf-autotable": "https://aistudiocdn.com/jspdf-autotable@^3.8.2",
        "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.1",
        "vite": "https://aistudiocdn.com/vite@^7.2.4",
        "@supabase/supabase-js": "https://aistudiocdn.com/@supabase/supabase-js@^2.39.0"
      }
    }
    </script>
  <link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="app-loader">
      <div class="loader-logo">
        <svg width="40" height="40" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 30 L40 75 L60 30 L80 75 L100 30" stroke="white" strokeWidth="12" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      </div>
      <div class="loader-spinner"></div>
      <p id="loader-status" style="color: #94a3b8; font-size: 11px; margin-top: 15px; font-weight: 500;">Spouštění systému 1.6.6...</p>
    </div>

    <div id="root"></div>

    <!-- Hlavní import aplikace bez query parametrů pro kompatibilitu s Vite buildem -->
    <script type="module" src="./index.tsx"></script>

    <script>
      // Globální příznak startu
      window.APP_STARTED = false;

      // Záchranný skript pro případ bílé obrazovky
      setTimeout(() => {
        if (!window.APP_STARTED) {
          console.warn("Nouzový reset mezipaměti z důvodu selhání startu.");
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(regs => {
              for(let r of regs) r.unregister();
              caches.keys().then(keys => {
                Promise.all(keys.map(k => caches.delete(k))).then(() => {
                  window.location.reload(true);
                });
              });
            });
          } else {
            window.location.reload(true);
          }
        }
      }, 6000);
    </script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
