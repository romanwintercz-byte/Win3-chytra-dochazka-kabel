
<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="no">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Docházka">
    
    <title>Chytrá docházka</title>
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/9512/9512839.png">
    
    <!-- Polyfill pro es-moduly -->
    <script async src="https://ga.jspm.io/npm:es-module-shims@1.10.1/dist/es-module-shims.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
      body { font-family: 'Inter', sans-serif; background-color: #0f172a; margin: 0; padding: 0; overscroll-behavior-y: none; color: white; }
      #app-loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0f172a; z-index: 9999; text-align: center; padding: 20px; }
      .loader-logo { width: 80px; height: 80px; background: #4f46e5; border-radius: 20px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; box-shadow: 0 0 30px rgba(79, 70, 229, 0.4); }
      .loader-spinner { width: 30px; height: 30px; border: 3px solid rgba(255,255,255,0.1); border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite; }
      
      @keyframes spin { to { transform: rotate(360deg); } }
      
      /* Oprava animací pro modální okna */
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes scaleIn {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
      }
      .animate-fade-in { animation: fadeIn 0.2s ease-out forwards; }
      .animate-scale-in { animation: scaleIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

      #reset-btn { display: none; margin-top: 20px; background: #ef4444; color: white; padding: 14px 28px; border-radius: 12px; font-size: 14px; font-weight: bold; border: none; cursor: pointer; z-index: 10000; }
      #error-display { display: none; margin-top: 20px; background: #334155; color: #f87171; padding: 12px; border-radius: 8px; font-family: monospace; font-size: 10px; max-width: 90%; word-break: break-all; text-align: left; }

      /* Tiskové styly pro A4 */
      @media print {
        body { background-color: white !important; color: black !important; }
        #root, .md\:hidden, #app-loader, .sidebar, .mobile-nav, .no-print, #help-button { display: none !important; }
        .print-only { display: block !important; }
        @page { size: A4 portrait; margin: 8mm; }
        .print-report { width: 100%; color: black !important; font-size: 8pt; line-height: 1.1; }
        table { width: 100%; border-collapse: collapse; margin-top: 4px; margin-bottom: 8px; }
        th, td { border: 1px solid #333; padding: 3px 5px; text-align: left; color: black !important; vertical-align: middle; }
        th { background-color: #f0f0f0 !important; font-weight: bold; font-size: 7pt; text-transform: uppercase; }
        .text-right { text-align: right; }
        .text-center { text-align: center; }
        .font-bold { font-weight: bold; }
        .header { display: flex; justify-content: space-between; border-bottom: 2px solid #000; padding-bottom: 4px; margin-bottom: 8px; }
        .signatures { display: flex; justify-content: space-between; margin-top: 15px; }
        .sig-box { border-top: 1px solid #000; width: 45%; text-align: center; padding-top: 2px; font-size: 7pt; }
        h2 { font-size: 10pt; margin: 4px 0; border-bottom: 1px solid #666; padding-bottom: 2px; }
        .bg-gray { background-color: #f9f9f9 !important; }
        .col-hours { width: 35px; text-align: right; }
      }
      .print-only { display: none; }
    </style>

    <script type="importmap-shim">
      {
        "imports": {
          "react": "https://esm.sh/react@19.0.0",
          "react/": "https://esm.sh/react@19.0.0/",
          "react-dom": "https://esm.sh/react-dom@19.0.0",
          "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
          "@google/genai": "https://esm.sh/@google/genai@1.30.0",
          "uuid": "https://esm.sh/uuid@11.0.0",
          "recharts": "https://esm.sh/recharts@2.15.0",
          "jspdf": "https://esm.sh/jspdf@2.5.2",
          "jspdf-autotable": "https://esm.sh/jspdf-autotable@3.8.4",
          "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.47.10"
        }
      }
    </script>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "uuid": "https://esm.sh/uuid@^13.0.0",

</head>
  <body>
    <div id="app-loader">
      <div class="loader-logo">
        <svg width="40" height="40" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 30 L40 75 L60 30 L80 75 L100 30" stroke="white" strokeWidth="12" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      </div>
      <div class="loader-spinner"></div>
      <p id="loader-status" style="color: #94a3b8; font-size: 13px; margin-top: 20px;">Spouštění v1.9.21...</p>
      <div id="error-display"></div>
      <button id="reset-btn" onclick="emergencyReset()">OPRAVIT A RESETOVAT</button>
    </div>

    <div id="root"></div>
    <div id="print-mount" class="print-only"></div>

    <script type="module-shim" src="./index.tsx?v=1.9.21"></script>

    <script>
      window.APP_STARTED = false;
      window.onerror = function(msg, url, line, col, error) {
        var errDiv = document.getElementById('error-display');
        var btn = document.getElementById('reset-btn');
        if (errDiv) {
          errDiv.style.display = 'block';
          errDiv.innerText = "CHYBA: " + msg + (line ? "\nL:" + line : "");
        }
        if (btn) btn.style.display = 'block';
        return false;
      };
      window.emergencyReset = function() {
        if (confirm("Opravit aplikaci? Smažou se dočasná data a mezipaměť.")) {
          localStorage.clear();
          sessionStorage.clear();
          if ('caches' in window) {
            caches.keys().then(function(names) {
              for (var name of names) caches.delete(name);
            });
          }
          alert("Vyčištěno. Restartuji...");
          setTimeout(function() { window.location.href = 'index.html?r=' + Date.now(); }, 500);
        }
      };
      setTimeout(function() {
        if (!window.APP_STARTED) {
          document.getElementById('loader-status').innerText = "Problém se spuštěním. Zkuste opravu.";
          document.getElementById('reset-btn').style.display = "block";
        }
      }, 7000);
    </script>
  </body>
</html>
