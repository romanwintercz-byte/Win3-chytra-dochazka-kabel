<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    
    <meta name="theme-color" content="#0f172a" />
    <title>Chytrá docházka</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
      body { font-family: 'Inter', sans-serif; background-color: #0f172a; margin: 0; padding: 0; color: white; overflow: hidden; }
      #app-loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0f172a; z-index: 9999; }
      .loader-spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.1); border-top-color: #4f46e5; border-radius: 50%; animation: spin 1s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      #root { height: 100vh; overflow: hidden; }
    </style>

    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",

    "@google/genai": "https://esm.sh/@google/genai@1.30.0",
    "uuid": "https://esm.sh/uuid@11.0.0",
    "recharts": "https://esm.sh/recharts@2.15.0",
    "jspdf": "https://esm.sh/jspdf@2.5.2",
    "jspdf-autotable": "https://esm.sh/jspdf-autotable@3.8.4",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.47.10",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="app-loader">
      <div class="loader-spinner"></div>
      <p id="loader-status" style="color: #94a3b8; font-size: 14px; margin-top: 16px;">Inicializace systému...</p>
    </div>

    <div id="root"></div>

    <script type="module-shim" src="./index.tsx"></script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
