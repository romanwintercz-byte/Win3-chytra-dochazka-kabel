<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    
    <meta name="theme-color" content="#0f172a" />
    <!-- Zakázání standalone režimu pro iPhone - ikona na ploše nyní otevře standardní Safari -->
    <meta name="apple-mobile-web-app-capable" content="no">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Docházka">
    
    <title>Chytrá docházka</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/9512/9512839.png">
    
    <!-- Polyfill pro es-moduly (Zásadní pro Safari) -->
    <script async src="https://ga.jspm.io/npm:es-module-shims@1.10.1/dist/es-module-shims.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
      body { font-family: 'Inter', sans-serif; background-color: #0f172a; margin: 0; padding: 0; overscroll-behavior-y: none; color: white; }
      #app-loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0f172a; z-index: 9999; text-align: center; padding: 20px; }
      .loader-logo { width: 80px; height: 80px; background: #4f46e5; border-radius: 20px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; box-shadow: 0 0 30px rgba(79, 70, 229, 0.4); }
      .loader-spinner { width: 30px; height: 30px; border: 3px solid rgba(255,255,255,0.1); border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      #reset-btn { display: none; margin-top: 20px; background: #ef4444; color: white; padding: 14px 28px; border-radius: 12px; font-size: 14px; font-weight: bold; border: none; cursor: pointer; z-index: 10000; }
      #error-display { display: none; margin-top: 20px; background: #334155; color: #f87171; padding: 12px; border-radius: 8px; font-family: monospace; font-size: 10px; max-width: 90%; word-break: break-all; text-align: left; }
    </style>

    <!-- JEDINÁ IMPORTNÍ MAPA (type="importmap-shim" pro Safari) -->
    <script type="importmap-shim">
    {
      "imports": {
        "react": "https://esm.sh/react@19.0.0",
        "react/": "https://esm.sh/react@19.0.0/",
        "react-dom": "https://esm.sh/react-dom@19.0.0",
        "react-dom/": "https://esm.sh/react-dom@19.0.0/",
        "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
        "@google/genai": "https://esm.sh/@google/genai@1.30.0",
        "uuid": "https://esm.sh/uuid@11.0.0",
        "recharts": "https://esm.sh/recharts@2.15.0",
        "jspdf": "https://esm.sh/jspdf@2.5.2",
        "jspdf-autotable": "https://esm.sh/jspdf-autotable@3.8.4",
        "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.47.10"
      }
    }
    </script>
  <script type="importmap">
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="app-loader">
      <div class="loader-logo">
        <svg width="40" height="40" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 30 L40 75 L60 30 L80 75 L100 30" stroke="white" strokeWidth="12" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      </div>
      <div class="loader-spinner"></div>
      <p id="loader-status" style="color: #94a3b8; font-size: 13px; margin-top: 20px;">Spouštění v1.9.1...</p>
      <div id="error-display"></div>
      <button id="reset-btn" onclick="emergencyReset()">OPRAVIT A RESETOVAT</button>
    </div>

    <div id="root"></div>

    <script type="module-shim" src="./index.tsx"></script>

    <script>
      window.APP_STARTED = false;
      
      window.onerror = function(msg, url, line, col, error) {
        var errDiv = document.getElementById('error-display');
        var btn = document.getElementById('reset-btn');
        if (errDiv) {
          errDiv.style.display = 'block';
          errDiv.innerText = "CHYBA: " + msg + (line ? "\nL:" + line : "");
        }
        if (btn) btn.style.display = 'block';
        return false;
      };

      window.emergencyReset = function() {
        if (confirm("Opravit aplikaci? Smažou se dočasná data a mezipaměť.")) {
          localStorage.clear();
          sessionStorage.clear();
          if ('caches' in window) {
            caches.keys().then(function(names) {
              for (var name of names) caches.delete(name);
            });
          }
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for(var r of regs) r.unregister();
            });
          }
          alert("Vyčištěno. Restartuji...");
          setTimeout(function() { window.location.href = 'index.html?r=' + Date.now(); }, 500);
        }
      };

      setTimeout(function() {
        if (!window.APP_STARTED) {
          document.getElementById('loader-status').innerText = "Problém se spuštěním. Zkuste opravu.";
          document.getElementById('reset-btn').style.display = "block";
        }
      }, 7000);
    </script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
